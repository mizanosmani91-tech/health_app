name: Build Android APK

# Manual: GitHub → Actions → "Build Android APK" → Run workflow.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      # Stable signing key => stable SHA-1 => Google sign-in keeps working across builds.
      # Create once (see README "APK বানানো") and store as repository secrets.
      - name: Restore release keystore (if configured)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/release.jks
            cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
            echo "Using release keystore"
          else
            echo "No keystore secret: falling back to the debug key (Google sign-in will NOT match your registered SHA-1)"
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Print signing SHA-1 (register this in the Google Android OAuth client)
        run: |
          if [ -f android/release.jks ]; then
            keytool -list -v -keystore android/release.jks -alias "${{ secrets.ANDROID_KEY_ALIAS }}" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -E "SHA1|SHA-1"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: health-diary-apk
          path: build/app/outputs/flutter-apk/app-release.apk
